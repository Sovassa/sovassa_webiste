<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" width="160" height="80">
  <defs>
    <clipPath id="gf-clip">
      <rect width="160" height="80" rx="8" ry="8"/>
    </clipPath>
    <linearGradient id="gf-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#gf-clip)">
    <!-- Top Bar: GoodFirms Blue -->
    <rect x="0" y="0" width="160" height="48" fill="#004AAD"/>
    <!-- GoodFirms Ribbon Shield + Typography -->
    <g transform="translate(18, 11)">
      <!-- Official Ribbon Shield with Star -->
      <g transform="translate(0, 1.5)">
        <!-- Gold Ribbon Body -->
        <path fill="url(#gf-gold)" d="M2.5 19.5l3.5 2.5a5.5 5.5 0 0 0 7 0l3.5-2.5a5.5 5.5 0 0 0 2.5-4.8V2.2A1.8 1.8 0 0 0 17.2.4h-15A1.8 1.8 0 0 0 .4 2.2v12.5a5.5 5.5 0 0 0 2.1 4.8z"/>
        <!-- Star inside shield -->
        <polygon points="9.5,4.5 11,8 14.5,8.5 12,11 12.5,14.5 9.5,12.8 6.5,14.5 7,11 4.5,8.5 8,8" fill="#FFFFFF"/>
      </g>
      <!-- "GoodFirms" Wordmark -->
      <text x="24" y="19.5" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18.5" font-weight="900" letter-spacing="-0.3">Good<tspan font-weight="500" fill="#E0E7FF">Firms</tspan></text>
    </g>
    <!-- Separator Line -->
    <line x1="0" y1="48" x2="160" y2="48" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
    <!-- Bottom Bar: Charcoal with Stars & Text -->
    <rect x="0" y="48" width="160" height="32" fill="#111827"/>
    <!-- 5 Golden Stars -->
    <g fill="#FFB800" transform="translate(16, 59)">
      <polygon points="6,0 7.8,3.8 12,4.4 9,7.3 9.7,11.5 6,9.5 2.3,11.5 3,7.3 0,4.4 4.2,3.8"/>
      <polygon points="19,0 20.8,3.8 25,4.4 22,7.3 22.7,11.5 19,9.5 15.3,11.5 16,7.3 13,4.4 17.2,3.8"/>
      <polygon points="32,0 33.8,3.8 38,4.4 35,7.3 35.7,11.5 32,9.5 28.3,11.5 29,7.3 26,4.4 30.2,3.8"/>
      <polygon points="45,0 46.8,3.8 51,4.4 48,7.3 48.7,11.5 45,9.5 41.3,11.5 42,7.3 39,4.4 43.2,3.8"/>
      <polygon points="58,0 59.8,3.8 64,4.4 61,7.3 61.7,11.5 58,9.5 54.3,11.5 55,7.3 52,4.4 56.2,3.8"/>
    </g>
    <!-- TOP RATED text -->
    <text x="117" y="69.5" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="1.2" text-anchor="middle">TOP RATED</text>
  </g>
  <!-- Outer subtle border -->
  <rect x="0.5" y="0.5" width="159" height="79" rx="7.5" ry="7.5" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
</svg>
