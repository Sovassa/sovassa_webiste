<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 682 1024" width="682" height="1024">
  <defs>
    <linearGradient id="bg-grad-sk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2340" />
      <stop offset="50%" stop-color="#07182c" />
      <stop offset="100%" stop-color="#030e1a" />
    </linearGradient>
    <radialGradient id="glow-grad-sk" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#0d5edb" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#00a896" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#07182c" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="border-grad-sk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#00a896" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0d5edb" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="682" height="1024" fill="url(#bg-grad-sk)" />
  <circle cx="341" cy="460" r="340" fill="url(#glow-grad-sk)" />

  <!-- Geometric Ambient Architecture Rings -->
  <circle cx="341" cy="430" r="260" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" stroke-dasharray="8 8" />
  <circle cx="341" cy="430" r="190" fill="none" stroke="rgba(13,94,219,0.22)" stroke-width="1.5" />
  <circle cx="341" cy="430" r="130" fill="none" stroke="rgba(0,168,150,0.25)" stroke-width="1.5" />

  <!-- Executive Silhouette Graphic -->
  <g transform="translate(341, 480)">
    <!-- Shoulders / Torso -->
    <path d="M-150,420 C-150,270 -100,190 -55,160 C-30,140 -20,115 -20,90 L-20,65 C-12,70 -5,72 0,72 C5,72 12,70 20,65 L20,90 C20,115 30,140 55,160 C100,190 150,270 150,420 Z" 
          fill="rgba(255,255,255,0.06)" stroke="url(#border-grad-sk)" stroke-width="2.5" />
    <!-- Head Outline -->
    <circle cx="0" cy="-20" r="80" fill="rgba(255,255,255,0.08)" stroke="url(#border-grad-sk)" stroke-width="2.5" />
    
    <!-- Monogram Circle Badge -->
    <circle cx="0" cy="-20" r="62" fill="#07182c" stroke="rgba(56,189,248,0.6)" stroke-width="2.5" />
    <text x="0" y="-3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="3">SK</text>

    <!-- Subtle Label -->
    <text x="0" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="rgba(255,255,255,0.6)" text-anchor="middle" letter-spacing="2">SUKHWINDER KAUR</text>
    <text x="0" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="rgba(56,189,248,0.85)" text-anchor="middle" letter-spacing="1">FOUNDER &amp; MANAGING DIRECTOR</text>
  </g>
</svg>
